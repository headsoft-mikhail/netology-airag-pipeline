paths:
  input: data/raw
  output: data/prepared

parsing:
  supported_formats:
    - txt
    - json
    - html

cleaning:
  remove_empty_documents: true

normalization:
  unicode_form: NFC

deduplication:
  exact: true
  near_duplicate: true
  similarity_threshold: 0.65

export:
  json: true
  jsonl: true