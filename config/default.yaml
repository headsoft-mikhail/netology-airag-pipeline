paths:
  input: data/raw
  output: data/prepared
  chunks: data/chunks

parsing:
  supported_formats:
    - txt
    - json
    - html

cleaning:
  remove_empty_documents: true

normalization:
  unicode_form: NFC

deduplication:
  exact: true
  near_duplicate: true
  similarity_threshold: 0.65

export:
  json: true
  jsonl: true

chunking:
  strategy: hybrid
  chunk_size: 220
  chunk_overlap: 40
  tokenizer_model: text-embedding-3-small