paths:
  input: data/raw
  prepared: data/prepared
  chunks: data/chunks
  embeddings: data/embeddings

parsing:
  supported_formats:
    - txt
    - json
    - html

cleaning:
  remove_empty_documents: true

normalization:
  unicode_form: NFC

deduplication:
  exact: true
  near_duplicate: true
  similarity_threshold: 0.65

chunking:
  strategy: sentence
  chunk_size: 220
  chunk_overlap: 50
  tokenizer_model: text-embedding-3-small

embedding:
  model: "intfloat/multilingual-e5-base"