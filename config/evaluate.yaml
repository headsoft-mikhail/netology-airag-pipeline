retrieval:
  embedding_model: "intfloat/multilingual-e5-base"
  vector_store_path: data/vector_store
  collection_name: rag_chunks
  search_top_k: 3
  excluded_documents:
    - data/raw/warranty_policy.txt

context:
  min_score: 0.75

llm:
  url: https://api.groq.com/openai/v1/chat/completions
  model: "openai/gpt-oss-20b"

test:
  report_path: data/evaluation
  questions:
    - Какой гарантийный срок на оборудование?
    - Какое время понадобится на диагностику?
    - Сколько стоит доставка в сервисный центр?
    - Как часто должны создаваться резервные копии?
    - Как часто нужно менять пароль?
    - Сколько хранятся резервные копии?
    - Сколько стоит страхование жизни?
    - Какие системные требования Desktop Support Tools?
    - Как проверить версию Desktop Support Tools?